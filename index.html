<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Mux Live</title>
</head>

<body>

  <h1>🔴 Live Mux</h1>

  <video
    id="video"
    controls
    autoplay
    muted
    playsinline
    width="800">
  </video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    const video = document.getElementById("video");

    const streamUrl =
      "https://stream.mux.com/TON_PLAYBACK_ID.m3u8";

    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = streamUrl;
    }
  </script>

</body>
</html>
