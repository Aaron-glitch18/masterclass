<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Mux Live</title>
</head>
  <style>
    *{
      margin:0;
    }
    body{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      /* gap:100px; */
      background-color:blue,
    }
    video{
      display:block;
      width:90%;
    }
  </style>

<body>

  <h1>Live Mux</h1>

  <video
    id="video"
    controls
    autoplay
    muted
    playsinline
    width="800">
  </video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    const video = document.getElementById("video");

    const streamUrl =
      "https://stream.mux.com/vtgJgZqUrX2fdPfUNAx9Ozw01NXHGW6wJefSv4Qu600bY.m3u8";

    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = streamUrl;
    }
  </script>

</body>
</html>
